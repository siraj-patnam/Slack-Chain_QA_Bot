[project]
name = "slack-qa-bot"
version = "0.1.0"
description = "Slack Q&A bot grounded in a SQLite knowledge base, built on LangGraph."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "sqlglot>=25.0",
    "langsmith>=0.2",
    "python-dotenv>=1.0",
    "openevals>=0.2.0",
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
    "slack-sdk>=3.42.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
