[project]
name = "slack-qa-bot"
version = "0.1.0"
description = "Slack Q&A bot grounded in a SQLite knowledge base, built on LangGraph."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "slack-bolt>=1.21",
    "sqlglot>=25.0",
    "langsmith>=0.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
